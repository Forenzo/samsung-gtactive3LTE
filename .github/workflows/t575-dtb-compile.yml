# Experimental SM-T575 DTB syntax/compile check only.
# Never generates or publishes a boot image, firmware or release.
name: t575-dtb-compile

on:
  push:
    branches:
      - port/sm-t575-bringup
    paths:
      - "dts/**"
      - "scripts/audit-t575-*.py"
      - "scripts/t575-stage34-static-dts-safety-audit.py"
      - "scripts/t575-stage43-audio-compile-config.py"
      - "scripts/t575-stage44-compile-tas2562.sh"
      - "scripts/t575-stage45-install-machine-source.py"
      - "drv/audio/t575/**"
      - "configs/gtactive3lte-tas2562-compileonly.config"
      - "scripts/build-t575-dtb.sh"
      - "scripts/t575-stage47-build-initramfs.sh"
      - "scripts/t575-stage47c-boot-component-audit.py"
      - "initramfs/t575-minimal-init.c"
      - "patches/linux/**"
      - ".github/workflows/t575-dtb-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t575-dtb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LTE fork
        uses: actions/checkout@v5

      - name: Install kernel DT build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python3 git gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Retrieve exact upstream Linux base
        shell: bash
        run: |
          set -euo pipefail
          read -r origin sha < patches/linux/BASE
          [[ "$origin" == "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git" ]] || {
            echo "Unexpected kernel source: $origin" >&2; exit 1;
          }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # A pinned source revision, not moving mainline.
          curl -fL --retry 4 --retry-delay 5 \
            "https://github.com/torvalds/linux/archive/${sha}.tar.gz" \
            -o /tmp/t575-linux.tar.gz
          mkdir -p kernel
          tar -xzf /tmp/t575-linux.tar.gz -C kernel --strip-components=1
          git -C kernel init -q
          git -C kernel config user.name "LTE DTB CI"
          git -C kernel config user.email "ci@localhost"
          git -C kernel add -A
          git -C kernel commit -qm "Import pinned kernel base"
          echo "Base: $sha"

      - name: Apply release-tested consolidated upstream patch
        shell: bash
        run: |
          set -euo pipefail
          # APKBUILD uses this consolidated patch, which is not equivalent
          # to replaying the independent patches/linux development series.
          patchfile="pmos/aports/device/testing/linux-postmarketos-exynos9810/gtactive3wifi.patch"
          test -s "$patchfile"
          git -C kernel apply --check "../$patchfile"
          git -C kernel apply "../$patchfile"
          test -s kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3wifi.dts
          echo "Applied upstream's packaged postmarketOS kernel patch."

      - name: Verify isolated LTE codec source and Kconfig wiring
        run: |
          python3 -m py_compile scripts/t575-stage43-audio-compile-config.py
          python3 scripts/t575-stage43-audio-compile-config.py --kernel kernel

      - name: Check evidence-backed LTE DTS safety gates
        run: |
          python3 -m py_compile scripts/t575-stage34-static-dts-safety-audit.py
          python3 scripts/t575-stage34-static-dts-safety-audit.py

      - name: Stage 45 — install LTE-only machine driver in CI kernel
        run: |
          python3 -m py_compile scripts/t575-stage45-install-machine-source.py
          python3 scripts/t575-stage45-install-machine-source.py kernel

      - name: Stage 45 — cross-compile TAS2562 codec and T575 machine objects
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/t575-stage44-compile-tas2562.sh "$PWD/kernel" "$PWD/t575-audio-build"

      - name: Configure arm64 kernel and compile T575 DTB
        shell: bash
        run: |
          set -euo pipefail
          make -C kernel ARCH=arm64 defconfig
          # Diagnostic-only config: built-in simpledrm, no LTE DECON takeover.
          kernel/scripts/config --file kernel/.config -e DRM -e DRM_SIMPLEDRM
          make -C kernel ARCH=arm64 olddefconfig
          bash scripts/build-t575-dtb.sh kernel
          test -s kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          file kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-memory.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-boot-basics.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-peripherals.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-input-details.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-display-input.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-display-handover.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-decon-source.py kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-simpledrm.py kernel/.config kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
          python3 scripts/audit-t575-simpledrm-source.py kernel

      - name: Stage 47 — compile diagnostic ARM64 kernel Image (never flashable)
        shell: bash
        run: |
          set -euo pipefail
          # This Image is NOT an Android BOOT image and is NOT approved for
          # Samsung S-Boot loading. T575 DECON takeover stays disabled.
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image
          test -s kernel/arch/arm64/boot/Image
          file kernel/arch/arm64/boot/Image
          echo "Stage 47: kernel Image compiled; no BOOT packaging or flashing."

      - name: Stage 47 — assemble isolated diagnostic initramfs, no device writes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/t575-stage47-build-initramfs.sh "$PWD/kernel" "$PWD/t575-initramfs"
          file t575-initramfs/init
          test -s t575-initramfs/t575-diagnostic-initramfs.cpio.gz
          echo "Kernel/DTB and diagnostic initramfs exist as separate offline artifacts."

      - name: Stage 47C — audit separate boot components (no image packaging)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t575-stage47c-boot-component-audit.py
          python3 scripts/t575-stage47c-boot-component-audit.py \
            --kernel kernel/arch/arm64/boot/Image \
            --dtb kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb \
            --initramfs t575-initramfs/t575-diagnostic-initramfs.cpio.gz

      - name: Save compile-only output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sm-t575-kernel-dtb-compile-only
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb
            t575-initramfs/t575-diagnostic-initramfs.cpio.gz
          retention-days: 7
