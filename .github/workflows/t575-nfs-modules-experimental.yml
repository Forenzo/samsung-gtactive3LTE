# Experimental, non-installable NFS kernel modules to explore no-flash NFS mount.
name: t575-nfs-modules-experimental

on:
  workflow_dispatch:
  push:
    branches:
      - integration/upstream-active3-family-firstboot
    paths:
      - 'configs/t575-nfs-module-test.config'
      - '.github/workflows/t575-nfs-modules-experimental.yml'
      - 'bootchain/build.sh'

permissions:
  contents: read

concurrency:
  group: t575-nfs-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install AArch64 cross-build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev libgnutls28-dev \
            uuid-dev device-tree-compiler swig python3-dev \
            python3-setuptools python3-pyelftools cpio kmod patch curl git tar gzip

      - name: Build from source with opt-in NFS modules
        env:
          NO_F2FS: '1'
          JOBS: '4'
          BRINGUP_EXTRA_CONFIG: ${{ github.workspace }}/configs/t575-nfs-module-test.config
        run: |
          set -euo pipefail
          mkdir -p out
          ci/bootchain/build out "t575-nfs-modules-compile-${GITHUB_RUN_NUMBER}"

      - name: Inventory kernel ABI and NFS module dependencies
        run: |
          set -euo pipefail
          P=build/bootchain/p/build/initramfs/modules
          K=build/bootchain/bringup
          test -f "$K/.config"
          echo 'Resolved NFS kernel config:'
          grep -E '^CONFIG_(NFS_FS|NFS_V3|SUNRPC|LOCKD|GRACE_PERIOD|MODVERSIONS|MODULE_UNLOAD)=' "$K/.config" || true
          grep -q '^CONFIG_NFS_FS=m$' "$K/.config" || {
            echo 'ERROR: kernel did not enable modular NFS filesystem support'
            exit 1
          }
          grep -Eq '^CONFIG_NFS_V3=(y|m)$' "$K/.config" || {
            echo 'ERROR: NFSv3 support missing; dump relevant config above'
            exit 1
          }
          test -d "$P" || {
            echo "ERROR: initramfs module collection missing: $P"
            exit 1
          }
          find "$P" -maxdepth 1 -type f -name '*.ko' -print | sort
          test -f "$P/nfs.ko" || {
            echo "ERROR: expected nfs.ko absent from $P"
            exit 1
          }
          mkdir -p dist/modules
          cp "$P"/*.ko dist/modules/
          {
            echo 'NOT READY TO LOAD: check physical device kernel version and module ABI first.'
            echo 'Never flash, reboot, mount or insmod merely because this build succeeded.'
            echo 'Physical kernel: Linux 7.3.0 #2 SMP PREEMPT (2026-11-13) per owner report.'
            echo 'Experimental build kernel release:'
            make -s -C build/bootchain/linux ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O="$PWD/$K" kernelrelease
            echo 'Experimental kernel version and options:'
            grep -E '^CONFIG_(NFS_FS|NFS_V3|SUNRPC|LOCKD|GRACE_PERIOD|MODVERSIONS|MODULE_UNLOAD)=' "$K/.config" || true
            echo 'Experimental module vermagic:'
            for f in dist/modules/*.ko; do
              echo "$(basename "$f"):"
              modinfo -F vermagic "$f" || true
            done
          } > dist/ABI-REVIEW-REQUIRED.txt
          (cd dist && sha256sum modules/*.ko > SHA256SUMS)
          cat dist/ABI-REVIEW-REQUIRED.txt

      - name: Upload unsigned modules for compatibility review ONLY
        uses: actions/upload-artifact@v4
        with:
          name: t575-nfs-modules-aarch64-UNTESTED-DO-NOT-LOAD
          path: dist/
          if-no-files-found: error
          retention-days: 14
