name: t575-nfs-tcp-probe

on:
  workflow_dispatch:
  push:
    branches:
      - integration/upstream-active3-family-firstboot
    paths:
      - 'first-gui/t575-nfs-tcp-probe.c'
      - '.github/workflows/t575-nfs-tcp-probe.yml'

permissions:
  contents: read

jobs:
  compile-static-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM64 cross-compiler and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross file
      - name: Compile static TCP reachability probe (never execute in CI)
        run: |
          set -euo pipefail
          mkdir -p dist
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -static -s \
            -o dist/t575-nfs-tcp-probe-aarch64 first-gui/t575-nfs-tcp-probe.c
          file dist/t575-nfs-tcp-probe-aarch64
          file dist/t575-nfs-tcp-probe-aarch64 | grep -E 'ARM aarch64|ARM64'
          file dist/t575-nfs-tcp-probe-aarch64 | grep 'statically linked'
          (cd dist && sha256sum t575-nfs-tcp-probe-aarch64 > SHA256SUMS)
          echo 'Build-only TCP probe; no mount, flash, or remote execution.'
      - name: Upload unsigned diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: t575-nfs-tcp-probe-aarch64-build-only
          path: dist/
          retention-days: 14
          if-no-files-found: error
