name: SM-T575 userdata writer v4 (explicitly armed)
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-install/t575-writer-v4.c'
      - '.github/workflows/t575-userdata-writer-v4.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compile static ARM64 executable
        run: |
          mkdir -p output
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra -Werror -o output/t575-writer-v4 native-install/t575-writer-v4.c
          file output/t575-writer-v4
          (cd output && sha256sum t575-writer-v4 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: t575-userdata-writer-v4
          path: output/
