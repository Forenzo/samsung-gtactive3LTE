name: t575-audio-unified-experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unified-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout LTE fork
        uses: actions/checkout@v5
      - name: Install kernel DT build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python3 git gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Retrieve exact upstream Linux base
        shell: bash
        run: |
          set -euo pipefail
          read -r origin sha < patches/linux/BASE
          [[ "$origin" == "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git" ]] || {
            echo "Unexpected kernel source: $origin" >&2; exit 1;
          }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # A pinned source revision, not moving mainline.
          curl -fL --retry 4 --retry-delay 5 \
            "https://github.com/torvalds/linux/archive/${sha}.tar.gz" \
            -o /tmp/t575-linux.tar.gz
          mkdir -p kernel
          tar -xzf /tmp/t575-linux.tar.gz -C kernel --strip-components=1
          git -C kernel init -q
          git -C kernel config user.name "LTE DTB CI"
          git -C kernel config user.email "ci@localhost"
          git -C kernel add -A
          git -C kernel commit -qm "Import pinned kernel base"
          echo "Base: $sha"
      - name: Apply release-tested consolidated upstream patch
        shell: bash
        run: |
          set -euo pipefail
          # APKBUILD uses this consolidated patch, which is not equivalent
          # to replaying the independent patches/linux development series.
          patchfile="pmos/aports/device/testing/linux-postmarketos-exynos9810/gtactive3.patch"
          test -s "$patchfile"
          git -C kernel apply --check "../$patchfile"
          git -C kernel apply "../$patchfile"
          gpu_patch="pmos/aports/device/testing/linux-postmarketos-exynos9810/t575-gpu-first-desktop.patch"
          test -s "$gpu_patch"
          git -C kernel apply --check "../$gpu_patch"
          git -C kernel apply "../$gpu_patch"
          test -s kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3wifi.dts
          echo "Applied upstream's packaged postmarketOS kernel patch."
      - name: Verify isolated LTE codec source and Kconfig wiring
        run: |
          python3 -m py_compile scripts/t575-stage43-audio-compile-config.py
          python3 scripts/t575-stage43-audio-compile-config.py --kernel kernel
      - name: Stage 45 — install LTE-only machine driver in CI kernel
        run: |
          python3 -m py_compile scripts/t575-stage45-install-machine-source.py
          python3 scripts/t575-stage45-install-machine-source.py kernel

      - name: Freeze patched kernel source revision
        shell: bash
        run: |
          set -euo pipefail

          git -C kernel config user.name "T575 Audio CI"
          git -C kernel config user.email "ci@localhost"
          git -C kernel add -A
          git -C kernel commit -qm "Prepare patched production audio sources"

          test -z "$(git -C kernel status --porcelain)"

          echo "PASS: patched kernel source clean"
          echo "No changes pushed to kernel repository"

      - name: Build unified audio modules only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends kmod file

          bash scripts/t575-stage98-build-audio-modules.sh \
            "$PWD/kernel" "$PWD/t575-audio-output"

          out="t575-audio-output/external"

          test -s "$out/snd-soc-tas2562.ko"
          test -s "$out/t575-tas2562-safeinit.ko"
          test -s "$out/t575-tas2562-safeconfig.ko"
          test -s "$out/t575-tas2562-transport.ko"
          test -s "$out/snd-soc-gtactive3lte-transport.ko"
          test -s "$out/t575-tas2562-transport64.ko"
          test -s "$out/t575-tas2562-clockcheck.ko"
          test -s "$out/t575-tas2562-protectcheck.ko"
          test -s "$out/t575-tas2562-safeactive.ko"
          test -s "$out/snd-soc-gtactive3lte-transport64.ko"
          test -s "$out/snd-soc-gtactive3lte-unified.ko"

          for module in "$out"/*.ko; do
            echo "=== $module ==="
            file "$module"
            modinfo "$module" | grep -E               '^(name|vermagic|depends|description):' || true
          done

          echo "PASS: experimental audio artifacts created"
          echo "NOT APPROVED FOR LOADING"

      - name: Upload diagnostic audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t575-unified-audio-NOT-FOR-LOADING
          path: |
            t575-audio-output/external/*.ko
            t575-audio-output/external/Module.symvers
          retention-days: 7

  alpine-toolchain:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Inspect native Alpine ARM64 compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ARCHITECTURE ==="
          uname -m

          echo "=== ALPINE TOOLCHAIN ==="
          docker run --rm --platform linux/arm64 alpine:edge sh -ec '
            apk add --no-cache gcc binutils make musl-dev
            echo "=== CONTAINER ARCHITECTURE ==="
            uname -m
            echo "=== COMPILER ==="
            gcc --version | head -1
            echo "=== COMPILER TARGET ==="
            gcc -dumpmachine
            echo "=== BINUTILS ==="
            ld --version | head -1
          '

          echo "=== RUNNER DISK ==="
          df -h .


  build-alpine-audio:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout LTE fork
        uses: actions/checkout@v5

      - name: Retrieve exact upstream Linux base
        shell: bash
        run: |
          set -euo pipefail
          read -r origin sha < patches/linux/BASE
          [[ "$origin" == "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git" ]] || {
            echo "Unexpected kernel source: $origin" >&2; exit 1;
          }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # A pinned source revision, not moving mainline.
          curl -fL --retry 4 --retry-delay 5 \
            "https://github.com/torvalds/linux/archive/${sha}.tar.gz" \
            -o /tmp/t575-linux.tar.gz
          mkdir -p kernel
          tar -xzf /tmp/t575-linux.tar.gz -C kernel --strip-components=1
          git -C kernel init -q
          git -C kernel config user.name "LTE DTB CI"
          git -C kernel config user.email "ci@localhost"
          git -C kernel add -A
          git -C kernel commit -qm "Import pinned kernel base"
          echo "Base: $sha"
      - name: Apply release-tested consolidated upstream patch
        shell: bash
        run: |
          set -euo pipefail
          # APKBUILD uses this consolidated patch, which is not equivalent
          # to replaying the independent patches/linux development series.
          patchfile="pmos/aports/device/testing/linux-postmarketos-exynos9810/gtactive3.patch"
          test -s "$patchfile"
          git -C kernel apply --check "../$patchfile"
          git -C kernel apply "../$patchfile"
          gpu_patch="pmos/aports/device/testing/linux-postmarketos-exynos9810/t575-gpu-first-desktop.patch"
          test -s "$gpu_patch"
          git -C kernel apply --check "../$gpu_patch"
          git -C kernel apply "../$gpu_patch"
          test -s kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3wifi.dts
          echo "Applied upstream's packaged postmarketOS kernel patch."
      - name: Verify isolated LTE codec source and Kconfig wiring
        run: |
          python3 -m py_compile scripts/t575-stage43-audio-compile-config.py
          python3 scripts/t575-stage43-audio-compile-config.py --kernel kernel
      - name: Stage 45 — install LTE-only machine driver in CI kernel
        run: |
          python3 -m py_compile scripts/t575-stage45-install-machine-source.py
          python3 scripts/t575-stage45-install-machine-source.py kernel

      - name: Freeze patched kernel source revision
        shell: bash
        run: |
          set -euo pipefail

          git -C kernel config user.name "T575 Audio CI"
          git -C kernel config user.email "ci@localhost"
          git -C kernel add -A
          git -C kernel commit -qm "Prepare patched production audio sources"

          test -z "$(git -C kernel status --porcelain)"

          echo "PASS: patched kernel source clean"
          echo "No changes pushed to kernel repository"

      - name: Restore native ARM64 compiler cache
        uses: actions/cache@v4
        with:
          path: .t575-ccache
          key: t575-alpine-arm64-ccache-v1-${{ github.sha }}
          restore-keys: |
            t575-alpine-arm64-ccache-v1-

      - name: Build audio modules with native Alpine ARM64 GCC
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e T575_CROSS_COMPILE="" \
            -e CCACHE_DIR=/workspace/.t575-ccache \
            -e T575_BUILD_VERSION="27-postmarketOS" \
            alpine:edge sh -ec '
              apk add --no-cache \
                bash build-base bc bison flex \
                openssl-dev elfutils-dev linux-headers \
                perl python3 findutils pahole zstd \
                kmod file git ccache

              echo "=== NATIVE ALPINE TOOLCHAIN ==="
              uname -m
              gcc --version | head -1
              gcc -dumpmachine
              ld --version | head -1

              mkdir -p "$CCACHE_DIR"
              ccache --max-size=2G
              export PATH="/usr/lib/ccache/bin:$PATH"
              export T575_USE_CCACHE=1
              ccache --show-stats

              echo "=== BUILD AUDIO ==="
              bash scripts/t575-stage98-build-audio-modules.sh \
                /workspace/kernel \
                /workspace/t575-audio-native-output

              echo "=== VERIFY MODULES ==="
              test -s t575-audio-native-output/external/snd-soc-tas2562.ko
              test -s t575-audio-native-output/external/t575-tas2562-safeinit.ko
              test -s t575-audio-native-output/external/t575-tas2562-safeconfig.ko
              test -s t575-audio-native-output/external/t575-tas2562-transport.ko
              test -s t575-audio-native-output/external/snd-soc-gtactive3lte-transport.ko
              test -s t575-audio-native-output/external/t575-tas2562-transport64.ko
              test -s t575-audio-native-output/external/t575-tas2562-clockcheck.ko
              test -s t575-audio-native-output/external/t575-tas2562-protectcheck.ko
              test -s t575-audio-native-output/external/t575-tas2562-safeactive.ko
              test -s t575-audio-native-output/external/snd-soc-gtactive3lte-transport64.ko
              test -s t575-audio-native-output/external/snd-soc-gtactive3lte-unified.ko

              modinfo t575-audio-native-output/external/*.ko \
                | grep -E "^(name|vermagic|depends):" || true

              ccache --show-stats
              chmod -R a+rX "$CCACHE_DIR"

              echo "PASS: native Alpine experimental audio build"
            '

      - name: Preserve native kernel symbol table
        shell: bash
        run: |
          set -euo pipefail
          out="t575-audio-native-output"
          test -s "$out/build/Module.symvers"
          cp "$out/build/Module.symvers" kernel-Module.symvers
          test -s "$out/build/vmlinux"
          test -s "$out/build/.config"
          cp "$out/build/.config" reconstructed-kernel.config
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objcopy --dump-section .BTF=reconstructed-kernel.btf "$out/build/vmlinux" /tmp/t575-vmlinux-review
          test -s reconstructed-kernel.btf
          rm -f /tmp/t575-vmlinux-review
          echo "PASS: reconstructed kernel BTF preserved"
          echo "PASS: native kernel symbol table preserved"
          wc -l kernel-Module.symvers

      - name: Generate deterministic audio test assets
        run: |
          python3 scripts/audio/t575-generate-test-audio.py \
            t575-audio-test-assets

      - name: Upload audio test assets
        uses: actions/upload-artifact@v4
        with:
          name: t575-audio-test-assets
          path: t575-audio-test-assets/*.wav
          retention-days: 7

      - name: Upload native Alpine diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t575-alpine-audio-NOT-FOR-LOADING
          path: |
            t575-audio-native-output/external/*.ko
            t575-audio-native-output/external/Module.symvers
            kernel-Module.symvers
            reconstructed-kernel.btf
            reconstructed-kernel.config
          retention-days: 7
