# Fast, source-only LTE bootloader review; deliberately never builds Linux.
name: t575-loader-review

on:
  push:
    branches:
      - port/sm-t575-bringup
    paths:
      - "scripts/t575-loader-source-review.py"
      - "scripts/t575-stage47c-boot-component-audit.py"
      - "scripts/t575-stage47d-uniloader-memory-audit.py"
      - "scripts/t575-loader-postlink-audit.py"
      - "bootchain/uniLoader/**"
      - ".github/workflows/t575-loader-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install standalone bootloader cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu bison flex
      - name: Configure and compile passive LTE board only (no Linux build)
        shell: bash
        run: |
          set -euo pipefail
          cd bootchain/uniLoader
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- gtactive3lte_defconfig
          grep -qx 'CONFIG_SAMSUNG_GTACTIVE3LTE=y' .config
          if grep -qx 'CONFIG_SAMSUNG_GTACTIVE3WIFI=y' .config; then
            echo "Wrong Wi-Fi board selector enabled" >&2
            exit 1
          fi
          if grep -qx 'CONFIG_CHAINLOAD=y' .config; then
            echo "Unsafe inherited chainload enabled" >&2
            exit 1
          fi
          # The top-level Makefile exposes the 'board' directory target,
          # not individual board/samsung/*.o targets. Kbuild compiles its
          # configured lib-y objects while producing board/lib.a.
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- board
          test -s board/samsung/board-gtactive3lte.o
          test -s board/lib.a
          aarch64-linux-gnu-nm board/samsung/board-gtactive3lte.o | grep -q ' board_ops'
          echo "LTE board object compiled; no Linux rebuild, no BOOT image."
      - name: Retrieve last successful T575 kernel build artifacts (NO kernel rebuild)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pull only our previously compiled Linux files from this branch.
          # Never invoke the T570 installer or its image packager.
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow t575-dtb-compile.yml \
            --branch port/sm-t575-bringup --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "No successful saved kernel run; do not build or flash." >&2
            exit 1
          }
          echo "Reusing successful kernel run: $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name sm-t575-kernel-dtb-compile-only \
            --dir "$RUNNER_TEMP/t575-components"
          base="$RUNNER_TEMP/t575-components"
          test -s "$base/kernel/arch/arm64/boot/Image"
          test -s "$base/kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb"
          test -s "$base/t575-initramfs/t575-diagnostic-initramfs.cpio.gz"
          python3 scripts/t575-stage47c-boot-component-audit.py \
            --kernel "$base/kernel/arch/arm64/boot/Image" \
            --dtb "$base/kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb" \
            --initramfs "$base/t575-initramfs/t575-diagnostic-initramfs.cpio.gz"
          python3 scripts/t575-stage47d-uniloader-memory-audit.py \
            --config bootchain/uniLoader/configs/gtactive3lte_defconfig \
            --kernel "$base/kernel/arch/arm64/boot/Image" \
            --dtb "$base/kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb" \
            --initramfs "$base/t575-initramfs/t575-diagnostic-initramfs.cpio.gz"
      - name: Link LTE uniLoader with real previously compiled Linux components
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/t575-components"
          cd bootchain/uniLoader
          # Reuse the board configuration created earlier in this job.
          grep -qx 'CONFIG_SAMSUNG_GTACTIVE3LTE=y' .config
          ! grep -qx 'CONFIG_SAMSUNG_GTACTIVE3WIFI=y' .config
          ! grep -qx 'CONFIG_CHAINLOAD=y' .config
          mkdir -p blob
          cp "$base/kernel/arch/arm64/boot/Image" blob/Image
          cp "$base/kernel/arch/arm64/boot/dts/exynos/exynos9810-gtactive3lte.dtb" blob/dtb
          cp "$base/t575-initramfs/t575-diagnostic-initramfs.cpio.gz" blob/ramdisk
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- -j2 uniLoader
          test -s uniLoader
          test -s uniLoader.o
          aarch64-linux-gnu-nm uniLoader.o | grep -q ' board_ops'
          aarch64-linux-gnu-readelf -SW uniLoader.o | grep -q ' .kernel '
          aarch64-linux-gnu-readelf -SW uniLoader.o | grep -q ' .dtb '
          aarch64-linux-gnu-readelf -SW uniLoader.o | grep -q ' .ramdisk '
          python3 "$GITHUB_WORKSPACE/scripts/t575-loader-postlink-audit.py" \
            --elf uniLoader.o \
            --kernel blob/Image \
            --initramfs blob/ramdisk \
            --config .config
          echo "PASS: real kernel, LTE DTB and diagnostic initramfs linked."
          echo "The output is a raw loader, NOT a Samsung BOOT image."
          echo "No run-time safety, S-Boot handover or flashability implied."
          echo "RESTORE/BOOT/FLASH GATE: BLOCKED"
          # CI does not upload executable loader or a flashable package.
          rm -f blob/Image blob/dtb blob/ramdisk uniLoader uniLoader.gz uniLoader.o
      - name: Check Python audits compile
        run: |
          python3 -m py_compile \
            scripts/t575-loader-source-review.py \
            scripts/t575-stage47c-boot-component-audit.py \
            scripts/t575-stage47d-uniloader-memory-audit.py \
            scripts/t575-loader-postlink-audit.py
      - name: Review inherited loader hardware assumptions
        run: python3 scripts/t575-loader-source-review.py
