# Fast, source-only LTE bootloader review; deliberately never builds Linux.
name: t575-loader-review

on:
  push:
    branches:
      - port/sm-t575-bringup
    paths:
      - "scripts/t575-loader-source-review.py"
      - "scripts/t575-stage47c-boot-component-audit.py"
      - "scripts/t575-stage47d-uniloader-memory-audit.py"
      - "bootchain/uniLoader/**"
      - ".github/workflows/t575-loader-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install standalone bootloader cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu bison flex
      - name: Configure and compile passive LTE board only (no Linux build)
        shell: bash
        run: |
          set -euo pipefail
          cd bootchain/uniLoader
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- gtactive3lte_defconfig
          grep -qx 'CONFIG_SAMSUNG_GTACTIVE3LTE=y' .config
          if grep -qx 'CONFIG_SAMSUNG_GTACTIVE3WIFI=y' .config; then
            echo "Wrong Wi-Fi board selector enabled" >&2
            exit 1
          fi
          if grep -qx 'CONFIG_CHAINLOAD=y' .config; then
            echo "Unsafe inherited chainload enabled" >&2
            exit 1
          fi
          # The top-level Makefile exposes the 'board' directory target,
          # not individual board/samsung/*.o targets. Kbuild compiles its
          # configured lib-y objects while producing board/lib.a.
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- board
          test -s board/samsung/board-gtactive3lte.o
          test -s board/lib.a
          aarch64-linux-gnu-nm board/samsung/board-gtactive3lte.o | grep -q ' board_ops'
          echo "LTE board object compiled; no Linux rebuild, no BOOT image."
      - name: Link complete LTE uniLoader with deliberately invalid test payloads
        shell: bash
        run: |
          set -euo pipefail
          cd bootchain/uniLoader
          # Link-time placeholders ONLY: non-bootable test bytes, never
          # sourced from a real kernel, never packaged, never uploaded.
          mkdir -p blob
          python3 - <<'PY'
          from pathlib import Path
          for name in ("Image", "dtb", "ramdisk"):
              Path("blob", name).write_bytes(
                  b"T575-LINK-TEST-NOT-BOOTABLE-" + name.encode() + b"\n")
          PY
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- -j2 uniLoader
          test -s uniLoader
          test -s uniLoader.o
          aarch64-linux-gnu-nm uniLoader.o | grep -q ' board_ops'
          echo "PASS: SM-T575 uniLoader linked with non-bootable placeholders."
          echo "NOT a BOOT image; no flash, no Android device operations."
          rm -f blob/Image blob/dtb blob/ramdisk uniLoader uniLoader.gz uniLoader.o
      - name: Check Python audits compile
        run: |
          python3 -m py_compile \
            scripts/t575-loader-source-review.py \
            scripts/t575-stage47c-boot-component-audit.py \
            scripts/t575-stage47d-uniloader-memory-audit.py
      - name: Review inherited loader hardware assumptions
        run: python3 scripts/t575-loader-source-review.py
