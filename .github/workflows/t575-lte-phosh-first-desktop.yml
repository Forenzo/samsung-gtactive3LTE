# One-shot SM-T575 full graphical Duranium/Phosh preview.
# Uses the upstream working Wi-Fi kernel source and userspace, but the LTE
# DTB, LTE board identity and the bootloader-on G3D power workaround.
# Builds an image only. DOES NOT install, flash, sign or publish updates.
name: t575-lte-phosh-first-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - work/t575-phosh-convergence
    paths:
      - '.github/workflows/t575-lte-phosh-first-desktop.yml'
      - 'pmos/aports/device/testing/linux-postmarketos-exynos9810/APKBUILD'
      - 'pmos/aports/device/testing/linux-postmarketos-exynos9810/t575-gpu-first-desktop.patch'
      - 'ci/keys/build.postmarketos.org.rsa.pub'

permissions:
  contents: read

concurrency:
  group: t575-lte-phosh-first-desktop
  cancel-in-progress: true

jobs:
  build-lte-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Recheck LTE-only build isolation and imported upstream fixes
        run: |
          set -euo pipefail
          scripts/config check
          python3 ci/t575-phosh-preflight.py source
          python3 - <<'PY'
          from pathlib import Path
          s = Path("config.toml").read_text()
          assert 'codename = "gtactive3"' in s
          assert 'images = false' in s, "Keep the LTE release channel disabled"
          apk = Path("pmos/aports/device/testing/linux-postmarketos-exynos9810/APKBUILD").read_text()
          assert "t575-gpu-first-desktop.patch" in apk
          patch = Path("pmos/aports/device/testing/linux-postmarketos-exynos9810/t575-gpu-first-desktop.patch").read_text()
          diffs = [line for line in patch.splitlines() if line.startswith("diff --git ")]
          assert diffs == ["diff --git a/arch/arm64/boot/dts/exynos/exynos9810-gtactive3.dts b/arch/arm64/boot/dts/exynos/exynos9810-gtactive3.dts"], diffs
          assert "+\t/delete-property/ power-domains;" in patch
          print("PASS: LTE-only GPU workaround; no Wi-Fi/common DTS changes")
          print("PASS: LTE image publishing still disabled")
          PY

      - name: Free space and enable ARM64 image assembly
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker system prune -af || true
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-user-static binfmt-support erofs-utils zstd podman
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h /

      - name: Prepare original postmarketOS Duranium build trees
        run: ci/prepare

      - name: Verify canonical Nura package builder
        run: |
          set -euo pipefail
          P=work/duranium-build/contrib/samsung-gtactive3/pkgbuilder.Containerfile
          BASE=gitlab.nura.eco:5050/nura/nura-oci:edge
          grep -Fxq "FROM $BASE" "$P"
          docker pull "$BASE"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE")
          test -n "$DIGEST"
          python3 - "$P" "$BASE" "$DIGEST" <<'PYBUILD'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          old = "FROM " + sys.argv[2]
          new = "FROM " + sys.argv[3]
          s = p.read_text()
          assert s.count(old) == 1
          assert "@sha256:" in new
          p.write_text(s.replace(old, new, 1))
          PYBUILD
          mkdir -p pkgs
          printf '%s\n' "$DIGEST" > pkgs/BUILDER-IMAGE
          echo "PASS: canonical Nura builder resolved to immutable digest"

      - name: Obtain upstream Linux source (no Samsung binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p distfiles
          BASE=$(sed -n 's/^_base="\(.*\)"/\1/p' pmos/aports/device/testing/linux-postmarketos-exynos9810/APKBUILD)
          test -n "$BASE"
          F="distfiles/linux-${BASE}.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 15 -H "Authorization: Bearer $GH_TOKEN" -o "$F.part" "https://github.com/torvalds/linux/archive/${BASE}.tar.gz"; then
              mv "$F.part" "$F"
              test -s "$F"
              EXPECTED=$(awk -v name="$(basename "$F")" '$2 == name {print $1}' pmos/aports/device/testing/linux-postmarketos-exynos9810/APKBUILD)
              [[ "$EXPECTED" =~ ^[a-f0-9]{128}$ ]]
              printf '%s  %s\n' "$EXPECTED" "$F" | sha512sum -c -
              echo "Kernel source retrieved."
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "Kernel source archive unavailable; do not substitute unpinned source." >&2
          exit 1

      - name: Build original family packages and LTE variant
        run: |
          set -euo pipefail
          mkdir -p ci-root/build pkgs ccache ci-build-compat
          # The upstream builder shells out to 'podman'. Ubuntu's hosted
          # rootless podman can exit 127 when spawning a nested container;
          # use the runner's preconfigured Docker daemon through a
          # command-compatible wrapper, without editing upstream scripts.
          cat > ci-build-compat/podman <<'SH'
          #!/bin/sh
          exec /usr/bin/docker "$@"
          SH
          chmod +x ci-build-compat/podman
          docker info >/dev/null
          # Print the exact upstream command being adapted. With one builder
          # process on one Actions runner, flock/nice serve no useful purpose.
          # They also hide the real container failure as exit status 127.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/duranium-build/contrib/samsung-gtactive3/build-apks.sh")
          s = p.read_text()
          anchor = 'flock "$LOCK" nice -n 19 podman run'
          if s.count(anchor) != 1:
              raise SystemExit("Unexpected upstream builder launch: " + "\n".join(x for x in s.splitlines() if "podman run" in x))
          # Alpine abuild-keygen -i defaults to 'doas' when doas and sudo
          # are absent. This disposable builder already runs as root; set
          # SUDO to empty so it installs the test package key directly.
          s = s.replace(anchor, 'podman run -e SUDO=')
          # The disposable build container leaves root-owned APKs inside
          # the host mktemp repo. Use sudo only to remove that directory
          # after the signed packages have already been copied to PKGS.
          cleanup = "trap 'rm -rf \"$work\"' EXIT"
          if s.count(cleanup) != 1:
              raise SystemExit("Unexpected upstream temp cleanup: " + "\\n".join(x for x in s.splitlines() if "trap " in x))
          s = s.replace(cleanup, "trap 'sudo rm -rf \"$work\"' EXIT")
          # Upstream creates a temporary /s/build.sh inside its builder.
          # Expose its first failing command instead of an opaque status 127.
          chmod = 'chmod +x "$work/build.sh"'
          if s.count(chmod) != 1:
              raise SystemExit("Cannot instrument upstream generated build.sh")
          s = s.replace(chmod, chmod + '\n' + 'sed -i \'2i set -x\' "$work/build.sh"')
          p.write_text(s)
          print("CI-only: removed flock/nice, enabled generated shell tracing")
          PY
          export PATH="$PWD/ci-build-compat:$PATH"
          command -v podman
          podman --version
          docker info --format 'Docker daemon: {{.ServerVersion}}'
          # Upstream build-apks.sh constructs the builder image itself, so
          # testing that image must happen only after it has been built.
          echo "Tracing commands executed inside the upstream package builder."
          GTA3_ROOT="$PWD/ci-root" PMAPORTS="$PWD/work/pmaports" PKGS="$PWD/pkgs" \
            DISTFILES="$PWD/distfiles" CCACHE="$PWD/ccache" JOBS=4 \
            sh -x work/duranium-build/contrib/samsung-gtactive3/build-apks.sh $(grep -Ev '^device/testing/gnome-shell-extension-' pmos/aports/BUILD)
          test -n "$(find pkgs -maxdepth 1 -name 'linux-postmarketos-exynos9810-gtactive3-*.apk' -print -quit)"
          test -n "$(find pkgs -maxdepth 1 -name 'device-samsung-gtactive3-*.apk' -print -quit)"
          echo 'PASS: built LTE kernel DTB and device packages'


      - name: Verify APKs and record exact upstream revisions for reproducible assembly
        run: |
          set -euo pipefail
          python3 ci/t575-phosh-preflight.py packages pkgs
          (
            cd pkgs
            sha256sum -- *.apk > SHA256SUMS
          )
          printf 'DURANIUM_UPSTREAM=%s\nPMAPORTS_UPSTREAM=%s\nDURANIUM_PATCHED_TREE=%s\nLOCAL_APORTS_TREE=%s\n' \
            "$(cat pmos/duranium-build/BASE)" \
            "$(git -C work/pmaports rev-parse HEAD)" \
            "$(git -C work/duranium-build rev-parse HEAD^{tree})" \
            "$(git rev-parse HEAD:pmos/aports)" > pkgs/UPSTREAM-REVISIONS
          echo "PASSED: LTE APKs preserved, hash manifest and upstream provenance recorded"

      - name: Upload compiled LTE APKs for independent Phosh image retries
        uses: actions/upload-artifact@v4
        with:
          name: t575-lte-phosh-compiled-apks-UNTESTED
          path: |
            pkgs/*.apk
            pkgs/SHA256SUMS
            pkgs/UPSTREAM-REVISIONS
            pkgs/BUILDER-IMAGE
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble-phosh-image:
    needs: build-lte-apks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ARM64 image assembler (no kernel rebuild)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            qemu-user-static binfmt-support erofs-utils zstd gnupg
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h /

      - name: Recreate the patched upstream mkosi and pmaports source trees
        run: ci/prepare

      - name: Download successful LTE kernel and device packages from this build
        uses: actions/download-artifact@v4
        with:
          name: t575-lte-phosh-compiled-apks-UNTESTED
          path: pkgs

      - name: Verify APK contents, signatures manifest, and upstream source consistency
        run: |
          set -euo pipefail
          python3 ci/t575-phosh-preflight.py source
          python3 ci/t575-phosh-preflight.py packages pkgs
          (cd pkgs && sha256sum -c SHA256SUMS)
          printf 'DURANIUM_UPSTREAM=%s\nPMAPORTS_UPSTREAM=%s\nDURANIUM_PATCHED_TREE=%s\nLOCAL_APORTS_TREE=%s\n' \
            "$(cat pmos/duranium-build/BASE)" \
            "$(git -C work/pmaports rev-parse HEAD)" \
            "$(git -C work/duranium-build rev-parse HEAD^{tree})" \
            "$(git rev-parse HEAD:pmos/aports)" > expected-upstream-revisions
          cmp pkgs/UPSTREAM-REVISIONS expected-upstream-revisions
          echo "PASS: no upstream revision drift between compiled packages and image assembly"

      - name: Set up the same Docker-compatible mkosi launcher
        run: |
          set -euo pipefail
          mkdir -p ci-build-compat ci-root/build
          cat > ci-build-compat/podman <<'SH'
          #!/bin/sh
          exec /usr/bin/docker "$@"
          SH
          chmod +x ci-build-compat/podman
          docker info >/dev/null
          echo "PASS: Docker-backed Podman command available for mkosi"

      - name: Assemble a complete, unpublished Phosh desktop system for SM-T575
        env:
          DEVICE: samsung-gtactive3
          UI: phosh
          CHANNEL: dev
        run: |
          set -euo pipefail
          # The upstream mkosi OCI image has a non-root default user.
          # In Docker on GitHub-hosted runners, its bind-mounted /workspace
          # is runner-owned (different uid), leading to PermissionError
          # creating mkosi-keyring-*. In this disposable CI container, run
          # the assembler as root, as the upstream Podman user namespace
          # ordinarily permits, and keep signed package validation enabled.
          export PATH="$PWD/ci-build-compat:$PATH"
          # Fast OCI smoke validated writable workspace plus unshare user/mount
          # namespaces with SYS_ADMIN and an unconfined AppArmor profile.
          # Give these only to the disposable mkosi image container; the
          # package-builder Docker container keeps its normal restrictions.
          # Avoid --privileged: it unnecessarily grants many more powers.
          export MKOSI_CONTAINER_ARGS="${MKOSI_CONTAINER_ARGS:-} --user=0:0 --cap-add=SYS_ADMIN --security-opt apparmor=unconfined"
          # Keep source checked out and output directory writable.
          chmod u+rwx work/duranium-build
          ln -sfn "$PWD/work/pmaports" work/duranium-build/pmaports
          cp pmos/duranium-build/LTE_CANDIDATE_VERSION work/duranium-build/mkosi.version
          GTA3_ROOT="$PWD/ci-root" PMAPORTS="$PWD/work/pmaports" PKGS="$PWD/pkgs" \
            SKIP_APKS=1 FRESH=1 \
            GTA3_UPDATE_BASE="$(GITHUB_REPOSITORY="$GITHUB_REPOSITORY" scripts/config get update.base)" \
            GTA3_CHANNEL_FILE="$(scripts/config get variants.gtactive3.channel_file)" \
            GTA3_IMAGE_ID=samsung-gtactive3-lte GTA3_LEGACY_IMAGE_IDS='' \
            sh work/duranium-build/contrib/samsung-gtactive3/build-image.sh --profile=compressed
          ls -lh work/duranium-build/mkosi.output/*/

      - name: Make mkosi output readable by the unprivileged runner
        if: always()
        run: |
          set -euo pipefail
          for p in work/duranium-build/mkosi.output work/duranium-build/mkosi.cache work/duranium-build/mkosi.pkgcache; do
            if [ -e "$p" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$p"
            fi
          done
          echo 'PASS: any generated images are accessible for validation and upload'

      - name: Check complete image, identity and Phosh session
        run: |
          set -euo pipefail
          OUT=work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge
          TAG=samsung-gtactive3-lte_phosh_edge-dev
          python3 ci/t575-phosh-preflight.py image "$OUT"
          PACKAGE_MANIFEST="$PWD/$OUT/BASE-PACKAGES.txt" ci/check-image "$OUT" "$(cat pmos/duranium-build/LTE_CANDIDATE_VERSION)" dev "$TAG" gtactive3
          (
            cd "$OUT"
            for file in *.raw.zst; do
              test -s "$file"
              zstd --test -q "$file"
            done
            sha256sum -- *.raw.zst *.efi > SHA256SUMS
          )
          echo 'PASS: compressed image integrity, UKI, upstream signing key and SHA256 manifest'
          test -n "$(find "$OUT" -maxdepth 1 -name '*.raw.zst' -print -quit)"
          echo 'PASS: SM-T575 Phosh compressed full OS image'
          echo 'UNTESTED: boot chain, first boot, desktop render on physical LTE'
          echo 'NO FLASHING / NO WRITES TO TABLET'
          echo 'INSTALLATION WOULD ERASE ANDROID USERDATA; BOOT BACKUP IS NOT A FULL DATA BACKUP'

      - name: Upload complete LTE Phosh image for owner review
        uses: actions/upload-artifact@v4
        with:
          name: t575-lte-phosh-full-desktop-UNTESTED
          path: |
            work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge/*.raw.zst
            work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge/*.efi
            work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge/*.sha256
            work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge/SHA256SUMS
            work/duranium-build/mkosi.output/samsung-gtactive3-lte_phosh_edge/BASE-PACKAGES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
