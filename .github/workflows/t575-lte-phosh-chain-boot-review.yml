# Separate BOOT-only U-Boot chain payload for a future full LTE Phosh boot.
# Never calls Heimdall, touches hardware or installs an OS.
name: t575-lte-phosh-chain-boot-review

on:
  workflow_dispatch:
  push:
    branches:
      - work/t575-phosh-convergence
    paths:
      - '.github/workflows/t575-lte-phosh-chain-boot-review.yml'
      - 'bootchain/build.sh'
      - 'bootchain/u-boot/configs/gtactive3lte_defconfig'
      - 'bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env'
      - 'bootchain/uniLoader/configs/gtactive3lte_chain_defconfig'
      - 'bootchain/uniLoader/board/samsung/board-gtactive3lte.c'

permissions:
  contents: read

jobs:
  build-lte-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Validate experimental-only LTE chain selection
        run: |
          set -euo pipefail
          bash -n bootchain/build.sh
          scripts/config check
          grep -q '^# CONFIG_CHAINLOAD is not set$' bootchain/uniLoader/configs/gtactive3lte_defconfig
          grep -q '^CONFIG_CHAINLOAD=y$' bootchain/uniLoader/configs/gtactive3lte_chain_defconfig
          grep -q '^CONFIG_SAMSUNG_GTACTIVE3LTE=y$' bootchain/uniLoader/configs/gtactive3lte_chain_defconfig
          grep -qx 'CONFIG_DEFAULT_DEVICE_TREE="exynos/exynos9810-gtactive3"' bootchain/u-boot/configs/gtactive3lte_defconfig
          grep -qx 'CONFIG_ENV_SOURCE_FILE="gtactive3lte"' bootchain/u-boot/configs/gtactive3lte_defconfig
          grep -q '^bootcmd=echo "SM-T575 LTE RESEARCH BOOTCHAIN' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          ! grep -q '^CONFIG_FASTBOOT_FLASH=y$' bootchain/u-boot/configs/gtactive3lte_defconfig
          ! grep -q '^CONFIG_FASTBOOT_OEM_RUN=y$' bootchain/u-boot/configs/gtactive3lte_defconfig
          ! grep -q '^CONFIG_CMD_USB_MASS_STORAGE=y$' bootchain/u-boot/configs/gtactive3lte_defconfig
          ! grep -q '^.*run duranium' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          # Keep the physically tested inactivity timeout into diagnostic Linux.
          grep -q '^bootmenu_0=Warm reset (attempt Linux fallback)=reset' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          grep -q '^bootcmd=echo "SM-T575 LTE RESEARCH BOOTCHAIN' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          grep -q '^bootmenu_5=TRY native Phosh EFI' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          grep -q '^lte_phosh_boot=' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          grep -q 'test "${board}" != gtactive3' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          grep -q 'part size scsi 0 ${ud_part}' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          ! grep -Eq '(^|[[:space:];])(saveenv|gpt write|mmc write|scsi write|blkmap write|mw.l)([[:space:];]|$)' bootchain/u-boot/board/samsung/exynos-mobile/gtactive3lte.env
          echo 'PASS: Phosh EFI is manual-only, LTE model and userdata mapping guarded, no storage writes'
          echo 'PASS: LTE U-Boot defaults to LTE DT and inspection-only menu, no fastboot/USB storage write interface'
          grep -q '0xca000000' bootchain/uniLoader/board/samsung/board-gtactive3lte.c
          grep -q 't575_chain_select' bootchain/uniLoader/board/samsung/board-gtactive3lte.c
          ! grep -qE '^[[:space:]]*\*\([^)]+\)[[:space:]]*=' bootchain/uniLoader/board/samsung/board-gtactive3lte.c
          echo 'PASS: LTE board source includes S-Boot framebuffer and passive key selection'
          echo 'PASS: existing diagnostic loader remains non-chainload'
      - name: Install cross-build requirements
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev libgnutls28-dev uuid-dev device-tree-compiler \
            swig python3-dev python3-setuptools python3-pyelftools cpio kmod patch curl git tar gzip file
      - name: Build full LTE boot chain and recovery diagnostic loader (NO DEVICE)
        env:
          NO_F2FS: '1'
          JOBS: '4'
          BRINGUP_LTE_CHAIN_TEST: '1'
          BRINGUP_EXTRA_DTS_PATCH: ${{ github.workspace }}/patches/experimental/t575-lte-gpu-bootloader-on-no-genpd.patch
        run: |
          set -euo pipefail
          mkdir -p out
          ci/bootchain/build out t575-lte-phosh-firstdesktop-1
      - name: Audit LTE and Wi-Fi loaders
        run: |
          set -euo pipefail
          test -s out/uniLoader-chain-gtactive3
          test -s out/uniLoader-linux-gtactive3
          test -s out/uniLoader-chain
          test -s out/uniLoader-linux
          test -s out/ramdisk.cpio.gz
          test -s out/MANIFEST
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          p=Path("out/gtactive3-bootchain_t575-lte-phosh-firstdesktop-1.tar.gz")
          assert p.is_file()
          with tarfile.open(p,"r:gz") as f:
              names=set(f.getnames())
          required={"uniLoader-chain-gtactive3","uniLoader-linux-gtactive3",
                    "uniLoader-chain","uniLoader-linux","ramdisk.cpio.gz","MANIFEST"}
          assert names == required,(names, required)
          for name in ("uniLoader-chain-gtactive3","uniLoader-linux-gtactive3"):
              data=Path("out",name).read_bytes()
              assert len(data)>4096 and data[56:60]==bytes.fromhex("41524d64"),name
          lte = Path("out/uniLoader-chain-gtactive3").read_bytes()
          assert b"SM-T575 LTE RESEARCH BOOTCHAIN" in lte, "LTE U-Boot menu not embedded"
          assert b"LTE board selection and menu navigation are untested" in lte, "LTE inspection environment missing"
          assert b"TRY native Phosh EFI" in lte, "explicit-only EFI menu missing"
          assert b"SM-T575 LTE: explicit read-only Phosh EFI handoff" in lte, "LTE EFI handoff script missing"
          # Both identifiers originate from our LTE-specific uniLoader board.
          assert b"samsung-gtactive3lte" in lte, "LTE uniLoader board name missing"
          # The passive simplefb prints early uniLoader information into S-Boot's
          # framebuffer; visual output on physical hardware remains unproven.
          print("PASS: LTE board string and passive simplefb source reviewed")
          print("PASS: LTE inspection-only U-Boot environment embedded in LTE chainloader")
          print("PASS: isolated LTE chainloader + LTE diagnostic loader compiled")
          print("BOOT/ANDROID/USERDATA WRITES: NONE")
          PY
      - name: Upload bootchain for offline assembly only
        uses: actions/upload-artifact@v4
        with:
          name: t575-lte-phosh-bootchain-UNTESTED
          path: |
            out/gtactive3-bootchain_t575-lte-phosh-firstdesktop-1.tar.gz
            out/MANIFEST
          retention-days: 14
          if-no-files-found: error
