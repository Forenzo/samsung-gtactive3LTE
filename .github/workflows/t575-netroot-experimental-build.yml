# Opt-in experimental kernel configuration. Never flash or overwrite tablet partitions.
name: t575-netroot-experimental-build

on:
  workflow_dispatch:
  push:
    branches:
      - integration/upstream-active3-family-firstboot
    paths:
      - '.github/workflows/t575-netroot-experimental-build.yml'
      - 'configs/t575-plasma-netroot.config'
      - 'bootchain/build.sh'

permissions:
  contents: read

concurrency:
  group: t575-netroot-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-netroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build requirements
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev libgnutls28-dev \
            uuid-dev device-tree-compiler swig python3-dev \
            python3-setuptools python3-pyelftools cpio kmod patch \
            curl git tar gzip

      - name: Check opt-in-only configuration
        run: |
          set -euo pipefail
          bash -n bootchain/build.sh
          scripts/config check
          test -s configs/t575-plasma-netroot.config
          grep -q '^CONFIG_NFS_FS=y$' configs/t575-plasma-netroot.config
          grep -q '^CONFIG_NFS_V3=y$' configs/t575-plasma-netroot.config
          if grep -q '^CONFIG_CHAINLOAD=y$' bootchain/uniLoader/configs/gtactive3lte_defconfig; then
            echo 'LTE boot chain must remain disabled'
            exit 1
          fi

      - name: Build unsigned diagnostic kernel with NFSv3 client (not flashable)
        env:
          NO_F2FS: '1'
          JOBS: '4'
          BRINGUP_EXTRA_CONFIG: ${{ github.workspace }}/configs/t575-plasma-netroot.config
        run: |
          set -euo pipefail
          mkdir -p out
          ci/bootchain/build out "t575-netroot-experimental-${GITHUB_RUN_NUMBER}"

      - name: Verify generated NFS configuration and diagnostic bundle
        run: |
          set -euo pipefail
          mkdir -p out
          python3 first-gui/audit-netroot-config.py build/bootchain/bringup/.config \
            | tee out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_NFS_FS=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_NFS_V3=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_SUNRPC=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_LOCKD=y$' out/t575-netroot-config-audit.txt
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          archives = list(Path("out").glob("*bootchain_*.tar.gz"))
          assert len(archives) == 1, f"expected one bootchain archive: {archives}"
          with tarfile.open(archives[0], "r:gz") as tf:
              names = set(tf.getnames())
              assert "uniLoader-linux-gtactive3" in names
              assert "ramdisk.cpio.gz" in names
              assert "uniLoader-chain-gtactive3" not in names
          print("EXPERIMENTAL NETROOT BUILD STRUCTURE: PASS (UNTESTED ON DEVICE)")
          print("BOOT/FLASH/USERDATA WRITES: NOT PERFORMED")
          PY

      - name: Archive diagnostic build for review only
        uses: actions/upload-artifact@v4
        with:
          name: t575-netroot-experimental-compile-only
          path: |
            out/*bootchain_*.tar.gz
            out/t575-netroot-config-audit.txt
          if-no-files-found: error
          retention-days: 14
