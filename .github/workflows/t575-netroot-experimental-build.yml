# Build-only experimental NFSv3 kernel. Never flashes, boots or runs on hardware.
name: t575-netroot-experimental-build

on:
  workflow_dispatch:
  push:
    branches:
      - integration/upstream-active3-family-firstboot
      - work/t575-gpu-genpd-config-review # temporary opt-in GPU review branch
    paths:
      - '.github/workflows/t575-netroot-experimental-build.yml'
      - 'configs/t575-plasma-netroot.config'
      - 'bootchain/build.sh'
      - 'patches/experimental/t575-lte-gpu-bootloader-on-no-genpd.patch'

permissions:
  contents: read

concurrency:
  group: t575-netroot-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-netroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build requirements
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev libgnutls28-dev \
            uuid-dev device-tree-compiler swig python3-dev \
            python3-setuptools python3-pyelftools cpio kmod patch \
            curl git tar gzip file

      - name: Check opt-in-only configuration
        run: |
          set -euo pipefail
          bash -n bootchain/build.sh
          scripts/config check
          test -s configs/t575-plasma-netroot.config
          grep -q '^CONFIG_NFS_FS=y$' configs/t575-plasma-netroot.config
          grep -q '^CONFIG_NFS_V3=y$' configs/t575-plasma-netroot.config
          if grep -q '^CONFIG_CHAINLOAD=y$' bootchain/uniLoader/configs/gtactive3lte_defconfig; then
            echo 'LTE boot chain must remain disabled'
            exit 1
          fi

      - name: Compile unsigned experimental kernel (NO DEVICE ACCESS)
        env:
          NO_F2FS: '1'
          JOBS: '4'
          BRINGUP_EXTRA_CONFIG: ${{ github.workspace }}/configs/t575-plasma-netroot.config
          BRINGUP_EXTRA_DTS_PATCH: ${{ github.workspace }}/patches/experimental/t575-lte-gpu-bootloader-on-no-genpd.patch
        run: |
          set -euo pipefail
          mkdir -p out
          ci/bootchain/build out "t575-netroot-experimental-${GITHUB_RUN_NUMBER}"

      - name: Audit LTE-only GPU DT staged change (NO DEVICE ACCESS)
        run: |
          set -euo pipefail
          LTE=build/bootchain/bringup/arch/arm64/boot/dts/exynos/exynos9810-gtactive3.dtb
          WIFI=build/bootchain/bringup/arch/arm64/boot/dts/exynos/exynos9810-gtactive3wifi.dtb
          test -s "$LTE" && test -s "$WIFI"
          fdtget -t s "$LTE" / model | grep -Fqx 'Samsung Galaxy Tab Active3 LTE (SM-T575)'
          fdtget -t s "$LTE" /soc@0/gpu@17500000 status | grep -qx okay
          if fdtget -t x "$LTE" /soc@0/gpu@17500000 power-domains >/dev/null 2>&1; then
            echo 'FAIL: LTE gpu still has deferred power-domains supplier'
            exit 1
          fi
          fdtget -t s "$LTE" /soc@0/power-domain@14064040 compatible | grep -qx 'samsung,exynos9810-g3d-pd'
          echo 'PASS: LTE GPU enabled, deferred genpd link removed in experimental DT'
          echo 'Only the LTE DT was patched; Wi-Fi DTS remained unchanged by optional patch'
          echo 'This is compilation evidence, NOT GPU probe or rendering evidence'

      - name: Audit kernel configuration and bootchain archive
        run: |
          set -euo pipefail
          python3 first-gui/audit-netroot-config.py build/bootchain/bringup/.config \
            | tee out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_NFS_FS=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_NFS_V3=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_SUNRPC=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_LOCKD=y$' out/t575-netroot-config-audit.txt
          grep -q '^CONFIG_NET_HANDSHAKE=y$' build/bootchain/bringup/.config
          echo 'NET_HANDSHAKE built-in: verified'
          echo 'kexec build features (not runtime tested):'
          grep -E '^CONFIG_(KEXEC|KEXEC_FILE|KEXEC_CORE|NET_HANDSHAKE)=' build/bootchain/bringup/.config || true
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          archives = list(Path("out").glob("*bootchain_*.tar.gz"))
          assert len(archives) == 1, f"Expected one bootchain archive: {archives}"
          with tarfile.open(archives[0], "r:gz") as tf:
              names = set(tf.getnames())
          assert "uniLoader-linux-gtactive3" in names, "Missing LTE diagnostic loader"
          assert "ramdisk.cpio.gz" in names, "Missing diagnostic initramfs archive"
          assert "uniLoader-chain-gtactive3" not in names, "Unexpected chainloader"
          print("EXPERIMENTAL NETROOT BUILD STRUCTURE: PASS")
          print("NO BOOT/FLASH/USERDATA DEVICE WRITES")
          PY

      - name: Export standalone unsigned ARM64 Image for REVIEW ONLY
        run: |
          set -euo pipefail
          mkdir -p out/standalone-review
          cp build/bootchain/bringup/arch/arm64/boot/Image out/standalone-review/Image
          python3 - <<'PY'
          from pathlib import Path
          data = Path("out/standalone-review/Image").read_bytes()
          assert len(data) > 4 * 1024 * 1024, "Suspiciously small ARM64 Image"
          assert data[56:60] == bytes.fromhex("41524d64"), "ARM64 Image magic missing"
          print("ARM64 Image header: PASS")
          print("Uncompressed Image bytes:", len(data))
          PY
          file out/standalone-review/Image
          (cd out/standalone-review && sha256sum Image > SHA256SUMS)
          {
            echo 'REVIEW ONLY. NEVER KEXEC/FLASH/BOOT WITHOUT RECOVERY VALIDATION.'
            echo 'Standalone Image is not an Android boot.img and not a ready boot recipe.'
            grep -E '^CONFIG_(NFS_FS|NFS_V3|SUNRPC|LOCKD|NET_HANDSHAKE|KEXEC|KEXEC_FILE|KEXEC_CORE)=' build/bootchain/bringup/.config || true
          } > out/standalone-review/REVIEW-ONLY.txt

      - name: Upload compile-only review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t575-netroot-experimental-UNTESTED-review
          path: |
            out/*bootchain_*.tar.gz
            out/t575-netroot-config-audit.txt
            out/standalone-review/*
          if-no-files-found: error
          retention-days: 14
