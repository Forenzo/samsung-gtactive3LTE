# Installed as usb-moded-notify.service.d/50-duranium-usb-debug.conf.
# While the USB debug gadget (g_debug) holds the port, usb-signaller cannot
# switch modes: it reports the gadget as the read-only mode "Netboot", every
# choice in the chooser failed, and usb-moded-notify showed the chooser again
# after each one (seen on the SM-T570, 2026-11-20). The debug layer's own
# indicator (duranium-usb-debug-notify) is shown instead, once per
# connection, and starts this unit again when debug is turned off.
[Service]
ExecCondition=/bin/sh -c '! grep -qs . /sys/kernel/config/usb_gadget/g_debug/UDC'
