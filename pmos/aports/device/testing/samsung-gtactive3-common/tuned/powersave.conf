# TuneD "powersave" (power-profiles-daemon "power-saver" through tuned-ppd;
# GNOME and Phosh switch to it at low battery) on the Galaxy Tab Active3:
# lower ceilings, same responsiveness. The stock profile keeps schedutil
# (EAS still places the work) and cpufreq boost off (the M3 levels above
# 1794 MHz stay unused). docs/BATTERY.md "Power saver" has the measurements.
#  - A55 at most 1456 MHz, three quarters of the maximum: Samsung's energy
#    table for these cores (stock device tree, energy-costs/core-core1) puts
#    the energy per cycle above 1456 MHz 25-34 % higher than at 1456 MHz
#  - M3 at most 1261 MHz, 70 % of 1794 MHz: Samsung's own power saving mode
#    limits the CPU to 70 %
#  - GPU at most 455 MHz of 572 (panfrost devfreq still idles at 260)
#  - schedutil changes frequency at most every 5 ms, as stock's cpufreq
#    does, instead of 150 us: each change is an ACPM request the kernel
#    polls for (docs/BATTERY.md root cause 2)
#  - the touch boost (gtactive3wifi-input-boost) keeps lifting the floors to
#    832/1066 MHz on touch, below these caps, so the first frames of a
#    swipe do not wait for schedutil
# The memory bus stays at 1794 MHz: nothing in our kernel can lower it yet
# (docs/BATTERY.md item 8). TuneD restores every value when another profile
# is selected.
[main]
summary=Optimize for low power consumption (Galaxy Tab Active3: CPUs at most 1456/1261 MHz, GPU 455 MHz, touch boost kept)
include=powersave

[sysfs_cpu_little]
type=sysfs
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1456000

[sysfs_cpu_big]
type=sysfs
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=1261000

[sysfs_gpu]
type=sysfs
/sys/class/devfreq/17500000.gpu/max_freq=455000000

[sysfs_schedutil]
type=sysfs
/sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us=5000
